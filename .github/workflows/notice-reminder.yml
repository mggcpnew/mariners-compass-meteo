# Lembrete diário (B3.3): abre ou atualiza a issue "Conferir avisos da Marinha"
# quando a última conferência (npm run notice:checked) passa de
# NOTICE_CHECK_MAX_AGE_H horas (padrão 24).
name: Lembrete de avisos

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NOTICE_CHECK_MAX_AGE_H: ${{ vars.NOTICE_CHECK_MAX_AGE_H || '24' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/ci/notice-reminder.ts
