# CI: lint, tipos, testes, build, verificações de repositório (AC-MVP-09 e 13),
# testes do banco (pgTAP, AC-MVP-14) no stack local do Supabase e E2E do front
# (Playwright, axe e Lighthouse; AC-MVP-01, 08, 10, 11, 12, 17 e 27).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Sem dados de maré no Git (AC-MVP-09)
        run: node scripts/ci/check-tide-files.ts
      - name: Sem chave de serviço no repositório nem no front (AC-MVP-13)
        run: node scripts/ci/check-secrets.ts

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Stack local (só banco e Storage)
        run: npx supabase start -x gotrue,realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Testes pgTAP (RLS fechada, reserve_calls)
        run: npx supabase test db

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache do Chromium do Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Chromium do Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependências de sistema do Chromium (com cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build do front (usado pelo E2E e pelo Lighthouse)
        run: npm run build
      - name: E2E (build de produção + API simulada)
        run: npm run e2e
        env:
          E2E_SKIP_BUILD: '1'
      - name: Lighthouse de acessibilidade (mínimo 90)
        run: npm run e2e:lighthouse
      - name: Relatórios do Playwright e do Lighthouse (só em falha)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            playwright-report/
            lighthouse-report.html
          if-no-files-found: ignore
          retention-days: 7
